<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mask or Clip paths if needed -->
  </defs>

  <!-- Green Background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#187a36"/>

  <!-- TRACTOR SILHOUETTE (WHITE) -->
  <g fill="#ffffff">
    <!-- Cabin Roof -->
    <path d="M 152 72 Q 152 68 156 68 L 268 68 Q 272 68 272 72 L 268 76 L 156 76 Z" />
    
    <!-- Main Body & Cabin outer fill -->
    <path d="
      M 156 74 
      L 268 74 
      L 282 142 
      L 392 172 
      Q 398 174 398 180 
      L 398 215 
      Q 398 220 392 220 
      L 332 220 
      A 46 46 0 0 0 242 220 
      L 218 220 
      A 64 64 0 0 0 98 210 
      L 106 182 
      Q 110 168 122 165 
      L 142 165 
      L 156 74 Z" 
    />

    <!-- Rear Fender Curve -->
    <path d="M 98 200 A 70 70 0 0 1 228 180 L 222 196 A 58 58 0 0 0 110 210 Z" />

    <!-- Exhaust Stack Pipe -->
    <path d="M 284 72 Q 284 66 288 66 Q 292 66 292 72 L 292 144 L 284 144 Z" />
    <ellipse cx="288" cy="67" rx="6" ry="2" fill="#ffffff" />

    <!-- Hood Slits (Slanted Ventilation) -->
    <path d="M 342 182 L 347 196 L 342 198 L 337 184 Z" fill="#187a36" />
    <path d="M 356 182 L 361 196 L 356 198 L 351 184 Z" fill="#187a36" />

    <!-- Cabin Windows (Cutouts showing background green) -->
    <!-- Rear Window -->
    <path d="M 162 82 L 206 82 L 206 142 L 152 142 Z" fill="#187a36" />
    <!-- Front Window -->
    <path d="M 214 82 L 262 82 L 274 142 L 214 142 Z" fill="#187a36" />

    <!-- REAR WHEEL -->
    <circle cx="162" cy="236" r="62" fill="#ffffff" />
    <circle cx="162" cy="236" r="38" fill="#187a36" />
    <circle cx="162" cy="236" r="16" fill="#ffffff" />

    <!-- FRONT WHEEL -->
    <circle cx="372" cy="248" r="42" fill="#ffffff" />
    <circle cx="372" cy="248" r="24" fill="#187a36" />
    <circle cx="372" cy="248" r="10" fill="#ffffff" />
  </g>

  <!-- EMBLEM (KAMON CREST) IN CIRCLE -->
  <g fill="#ffffff" transform="translate(256, 350)">
    <!-- Outer Circle Ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="5" />

    <!-- Central Kamon Crest Flower Design -->
    <!-- Center Dot & Petals -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    
    <!-- 4 Major Lobes (Top, Bottom, Left, Right) -->
    <!-- Top Lobe -->
    <path d="M -18 -8 C -22 -32 0 -44 0 -44 C 0 -44 22 -32 18 -8 Q 0 -18 -18 -8 Z" />
    <!-- Bottom Lobe -->
    <path d="M -18 8 C -22 32 0 44 0 44 C 0 44 22 32 18 8 Q 0 18 -18 8 Z" />
    <!-- Left Lobe -->
    <path d="M -8 -18 C -32 -22 -44 0 -44 0 C -44 0 -32 22 -8 18 Q -18 0 -8 -18 Z" />
    <!-- Right Lobe -->
    <path d="M 8 -18 C 32 -22 44 0 44 0 C 44 0 32 22 8 18 Q 18 0 8 -18 Z" />

    <!-- Inner Flower ring around center -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#187a36" stroke-width="2" />
    <!-- Petal accents inside ring -->
    <circle cx="0" cy="-12" r="3" fill="#187a36" />
    <circle cx="0" cy="12" r="3" fill="#187a36" />
    <circle cx="-12" cy="0" r="3" fill="#187a36" />
    <circle cx="12" cy="0" r="3" fill="#187a36" />
  </g>

  <!-- TEXT "IGARASHI" -->
  <text 
    x="256" 
    y="458" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="52" 
    letter-spacing="5"
  >IGARASHI</text>
</svg>